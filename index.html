<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматы в браузере</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main class="wrap">

  <!-- Экран карты уровней -->
  <section id="map-screen">
    <header class="topbar">
      <div class="brand"><span class="icon">&#9822;</span>Шахматы</div>
      <div class="progress-label" id="progress-label">Пройдено 0 из 10</div>
    </header>
    <div class="map" id="map"></div>
    <button id="human-game" class="wide-btn" type="button">Игра вдвоём</button>
  </section>

  <!-- Экран партии -->
  <section id="game-screen" class="hidden">
    <header class="topbar">
      <button id="back-to-map" class="back-btn" type="button" title="На карту уровней">&#8592;</button>
      <div class="brand small" id="level-title">Уровень</div>
      <div class="status" id="status">Ход белых</div>
    </header>

    <section class="board-zone">
      <div id="board" class="board" aria-label="Шахматная доска"></div>
    </section>

    <section class="panel">
      <div class="controls">
        <button id="new-game" type="button">Новая партия</button>
        <button id="undo" type="button">Отменить ход</button>
      </div>
      <div id="promotion" class="promotion hidden"></div>
      <div id="result" class="result hidden">
        <div class="result-text" id="result-text"></div>
        <div class="result-note" id="result-note"></div>
        <button id="to-map-btn" type="button">На карту уровней</button>
      </div>
      <div class="history-block">
        <div class="history-title">История ходов</div>
        <ol id="history" class="history"></ol>
      </div>
    </section>
  </section>

</main>

<script src="js/rules.js?v=2"></script>
<script src="js/ai.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
